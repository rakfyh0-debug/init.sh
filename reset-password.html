<title>Mot de passe oublié — init.sh</title>
<meta name="description" content="Réinitialise ton mot de passe init.sh.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="prompt">&gt;_</span> init.sh</a>
    <nav class="nav">
      <a href="index.html#formations">Formations</a>
      <a href="projets.html">Projets</a>
      <a href="a-propos.html">À propos</a>
    </nav>
    <a href="auth.html" id="nav-auth-btn" class="btn btn-outline">Connexion</a>
  </div>
</header>

<section class="page-header">
  <div class="wrap">
    <h1>Mot de passe oublié</h1>
    <p class="lead">Reçois un lien par email pour choisir un nouveau mot de passe.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="auth-card">

      <!-- Étape 1 : demander le lien -->
      <form id="form-request" class="auth-form" novalidate>
        <label>
          Email
          <input type="email" id="request-email" autocomplete="email" required>
        </label>
        <p id="request-error" class="auth-error"></p>
        <p id="request-info" class="auth-info"></p>
        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
        <p class="auth-foot">
          <a href="auth.html">Retour à la connexion</a>
        </p>
      </form>

      <!-- Étape 2 : choisir le nouveau mot de passe (affiché après clic sur le lien reçu par email) -->
      <form id="form-update" class="auth-form" style="display:none;" novalidate>
        <label>
          Nouveau mot de passe (8 caractères minimum)
          <input type="password" id="update-password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          Confirmer le mot de passe
          <input type="password" id="update-password-confirm" autocomplete="new-password" minlength="8" required>
        </label>
        <p id="update-error" class="auth-error"></p>
        <p id="update-info" class="auth-info"></p>
        <button type="submit" class="btn btn-primary">Changer le mot de passe</button>
      </form>

    </div>
  </div>
</section>

  </div>
</footer>

</body>
</html>
